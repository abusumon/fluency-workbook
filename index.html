<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>The Fluency Workbook</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: sticky chapter rail on the left, one reading column on the right; every Part owns a hue that tints its chapters. */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --ink:#151A2C; --muted:#586079; --line:#DBE0EE;
  --code-bg:#151A2E; --code-fg:#E4E8F6; --code-dim:#8C93B3;
  --p0:#8A5A1F; --p8:#0F6FA8; --p9:#9A6F00; --pa:#5F7000; --pr:#B4235F; --p1:#2F5BEA; --p2:#C2247A; --p3:#B86E00; --p4:#0A8A82; --p5:#6B3FD6; --p6:#D33E2B; --p7:#2D8632;
  --ok:#1E8E4F; --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, "Cascadia Code", Menlo, monospace;
  --hl-kw:#FF8FC7; --hl-str:#9BE39B; --hl-num:#FFC46B; --hl-com:#7F88AA; --hl-fn:#8FB4FF; --hl-type:#6FE3D8;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1020; --surface:#151930; --ink:#E7EAF5; --muted:#9BA2C0; --line:#272C48;
  --code-bg:#0A0D1A; --code-fg:#E4E8F6; --code-dim:#7D84A6;
  --p0:#E0A869; --p8:#62BDF2; --p9:#E8C04A; --pa:#C6D94F; --pr:#FF7FAE; --p1:#7C9BFF; --p2:#FF6FB4; --p3:#FFB547; --p4:#3FD6C9; --p5:#AA8DFF; --p6:#FF8A75; --p7:#7BD67F; --ok:#5BD68D; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1020; --surface:#151930; --ink:#E7EAF5; --muted:#9BA2C0; --line:#272C48;
  --code-bg:#0A0D1A; --code-fg:#E4E8F6; --code-dim:#7D84A6;
  --p0:#E0A869; --p8:#62BDF2; --p9:#E8C04A; --pa:#C6D94F; --pr:#FF7FAE; --p1:#7C9BFF; --p2:#FF6FB4; --p3:#FFB547; --p4:#3FD6C9; --p5:#AA8DFF; --p6:#FF8A75; --p7:#7BD67F; --ok:#5BD68D; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6}
a{color:var(--pc,var(--p1))}
code{font-family:var(--f-code);font-size:.86em;background:color-mix(in srgb,var(--pc,var(--p1)) 11%,transparent);padding:.08em .35em;border-radius:4px}
h1,h2,h3{font-family:var(--f-display);line-height:1.15;text-wrap:balance;margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--pc,var(--p1));outline-offset:2px}

.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
.rail{position:sticky;top:0;height:100vh;overflow-y:auto;border-right:1px solid var(--line);background:var(--surface);padding:22px 16px 40px}
.brand{display:flex;flex-direction:column;gap:2px;padding:0 8px 18px;text-decoration:none;color:var(--ink)}
.brand b{font-family:var(--f-display);font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:.8rem;color:var(--muted)}
.prog{margin:0 8px 18px;display:flex;flex-direction:column;gap:6px;font-size:.78rem;color:var(--muted)}
.bar{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--p1),var(--p2),var(--p3),var(--p4),var(--p5),var(--p6),var(--p7));border-radius:99px;transition:width .4s}
.navpart{margin-top:14px}
.navpart h4{font-family:var(--f-display);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pc);margin:0 8px 4px}
.navlink{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:8px;color:var(--ink);text-decoration:none;font-size:.92rem;line-height:1.3}
.navlink:hover{background:color-mix(in srgb,var(--pc) 9%,transparent)}
.navlink.on{background:color-mix(in srgb,var(--pc) 15%,transparent);font-weight:700}
.navlink .num{font-family:var(--f-code);font-size:.72rem;color:var(--pc);min-width:1.6em}
.navlink .dot{margin-left:auto;width:28px;height:4px;border-radius:9px;background:var(--line);overflow:hidden;flex:none}
.navlink .dot i{display:block;height:100%;background:var(--pc)}
.railtools{display:flex;gap:6px;margin:20px 8px 0}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:99px;padding:4px 12px;font-size:.8rem}
.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}

.main{min-width:0;padding-block:40px 90px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.col{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
.topbar{display:none}

/* Home */
.hero{padding:34px 0 8px;display:flex;flex-direction:column;gap:16px}
.hero .eyebrow{font-family:var(--f-code);font-size:.8rem;color:var(--muted)}
.hero h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:800;letter-spacing:-.03em}
.hero h1 em{font-style:normal;background:linear-gradient(90deg,var(--p1),var(--p2) 40%,var(--p3) 70%,var(--p4));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{font-size:1.12rem;color:var(--muted);max-width:62ch;margin:0}
.spectrum{display:flex;height:10px;border-radius:99px;overflow:hidden}
.spectrum i{flex:1}
.sec{display:flex;flex-direction:column;gap:14px}
.sec>h2{font-size:1.6rem;font-weight:700}
.sec>p{margin:0;color:var(--muted);max-width:65ch}
.loop{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.loop div{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.loop b{font-family:var(--f-display);font-size:1.05rem}
.loop span{font-size:.9rem;color:var(--muted)}
.loop small{font-family:var(--f-code);font-size:.72rem;color:var(--p2)}
.road{display:flex;flex-direction:column;border-left:3px solid var(--line);margin-left:8px}
.month{position:relative;padding:4px 0 18px 22px;display:flex;flex-direction:column;gap:4px}
.month::before{content:"";position:absolute;left:-9px;top:8px;width:15px;height:15px;border-radius:50%;background:var(--pc);box-shadow:0 0 0 4px var(--bg)}
.month .when{font-family:var(--f-code);font-size:.75rem;color:var(--pc);font-weight:600}
.month h3{font-size:1.15rem}
.month p{margin:0;font-size:.95rem;color:var(--muted)}
.month .chs{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.month .chs a{font-size:.78rem;text-decoration:none;border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);border-radius:99px;padding:1px 9px}
.res{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.resgroup{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--pc);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.resgroup h3{font-size:1rem;color:var(--pc)}
.resgroup ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.resgroup li{font-size:.88rem;line-height:1.4}
.resgroup li a{font-weight:700;text-decoration:none}
.resgroup li span{display:block;color:var(--muted)}
.tag{font-family:var(--f-code);font-size:.66rem;border-radius:4px;padding:0 5px;margin-left:4px;vertical-align:1px;background:color-mix(in srgb,var(--pc) 14%,transparent);color:var(--pc);font-weight:600}
.grid7{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:12px;text-decoration:none;color:var(--ink);background:color-mix(in srgb,var(--pc) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--pc) 30%,transparent)}
.pcard b{font-family:var(--f-display);font-size:.98rem;line-height:1.2}
.pcard span{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pcard .bar i{background:var(--pc)}
.note{border-left:4px solid var(--p3);background:color-mix(in srgb,var(--p3) 9%,var(--surface));padding:12px 16px;border-radius:0 10px 10px 0;font-size:.95rem}

/* Lessons & careers */
.lesson{display:flex;flex-direction:column;gap:10px;padding:18px 20px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-width:0}
.lesson h3{font-size:1.22rem}
.lesson .lbody p,.lesson .lbody li{max-width:68ch}
.lesson .lbody p{margin:0 0 8px} .lesson .lbody p:last-child{margin-bottom:0}
.lesson .lbody ul,.lesson .lbody ol{margin:0 0 8px;padding-left:1.25em;display:flex;flex-direction:column;gap:5px}
.lesson .lbody table{margin:6px 0}
.lesson .lbody td,.lesson .lbody th{border-bottom:1px solid var(--line)}
.lesson.math{background:color-mix(in srgb,var(--pc) 6%,var(--surface));border-color:color-mix(in srgb,var(--pc) 28%,transparent)}
.lesson .lnum{font-family:var(--f-code);font-size:.75rem;color:var(--pc);font-weight:600}
.lbody mjx-container[display="true"]{overflow-x:auto;overflow-y:hidden;max-width:100%;padding:4px 0}
.lbody mjx-container:not([display="true"]){display:inline-block;max-width:100%;overflow-x:auto;overflow-y:hidden;vertical-align:middle}
.stack{display:flex;flex-direction:column;gap:14px}
.needs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:.82rem;color:var(--muted)}
.needs a{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:1px 10px;color:var(--ink)}
.recap{border-left:4px solid var(--pc);padding:4px 0 4px 16px}
.recap ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:4px}
.careers{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.career{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;border-top:5px solid var(--pc)}
.career h3{font-size:1.2rem}
.career p{margin:0;font-size:.92rem}
.career .k{font-family:var(--f-display);font-size:.7rem;letter-spacing:.1em;text-transform:uppercase;color:var(--pc);font-weight:700}
.career ul{margin:0;padding-left:1.1em;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.career .chs{display:flex;flex-wrap:wrap;gap:5px}
.career .chs a{font-size:.75rem;text-decoration:none;border:1px solid color-mix(in srgb,var(--pc) 45%,transparent);border-radius:99px;padding:1px 8px}
.career .src{font-size:.78rem;color:var(--muted)}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.phd{border-collapse:collapse;font-size:.84rem;min-width:960px;width:100%}
.phd th{font-family:var(--f-display);text-align:left;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--p9);padding:10px 12px;border-bottom:2px solid var(--line);white-space:nowrap}
.phd td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:top;line-height:1.4}
.phd td:first-child{font-weight:700;min-width:170px}
.phd tr:last-child td{border-bottom:0}
.steps{display:flex;flex-direction:column;gap:10px}
.step{display:grid;grid-template-columns:140px minmax(0,1fr);gap:14px;padding:12px 16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;border-left:5px solid var(--pc)}
.step .when{font-family:var(--f-code);font-size:.78rem;color:var(--pc);font-weight:600}
.step b{font-family:var(--f-display);font-size:1.02rem;display:block;margin-bottom:2px}
.step p{margin:0;font-size:.92rem}
@media (max-width:560px){.step{grid-template-columns:1fr;gap:4px}}

.ctag{font-size:.7rem;font-weight:700;letter-spacing:.04em;border-radius:99px;padding:2px 9px;background:color-mix(in srgb,var(--tc) 16%,transparent);color:var(--tc)}
.arena{border-top:3px dashed color-mix(in srgb,var(--pa) 60%,transparent);padding-top:16px}
.arenaintro{border-left:4px solid var(--pa);padding:2px 0 2px 14px;max-width:68ch}
.arenaintro p{margin:0}

.sub:empty{display:none}
.sub{display:flex;flex-direction:column;gap:10px}
.subrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.subchip{font-size:.8rem;font-weight:700;color:var(--ok);background:color-mix(in srgb,var(--ok) 12%,transparent);border-radius:99px;padding:3px 10px}
.subwait,.substatus,.muted{font-size:.82rem;color:var(--muted)}
.subnotes{margin:0;font-size:.9rem;color:var(--muted)}
.btn.primary{background:var(--pc,var(--p1));border-color:var(--pc,var(--p1));color:#fff}
a.btn{text-decoration:none;color:var(--ink)}
.subform{display:flex;flex-direction:column;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px}
.subfields{display:flex;flex-wrap:wrap;gap:10px}
.subfields label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);flex:1;min-width:160px}
.subform select,.subform input,.subform textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%;box-sizing:border-box}
.subform textarea{font-family:var(--f-code);font-size:.84rem;line-height:1.5;resize:vertical;tab-size:4}
.subshome{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.subshome p{margin:0}
.sublist{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:.9rem}

/* Chapter */
.chhead{display:flex;flex-direction:column;gap:12px;padding:26px 0 4px}
.chhead .kicker{font-family:var(--f-code);font-size:.8rem;color:var(--pc);font-weight:600;letter-spacing:.02em}
.chhead h1{font-size:clamp(2rem,5vw,3rem);font-weight:800;letter-spacing:-.025em}
.chhead .goal{font-size:1.08rem;color:var(--muted);margin:0;max-width:62ch}
.meta{display:flex;flex-wrap:wrap;gap:8px}
.meta span{font-size:.78rem;border-radius:99px;padding:2px 10px;background:color-mix(in srgb,var(--pc) 12%,transparent);color:var(--pc);font-weight:700}
.primer{display:flex;flex-direction:column;gap:12px}
.primer p,.primer li{max-width:66ch}
.primer p{margin:0}
.primer ul{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}
.label{font-family:var(--f-display);font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:var(--pc);font-weight:700}
.code{background:var(--code-bg);border-radius:12px;overflow:hidden;color:var(--code-fg)}
.codebar{display:flex;align-items:center;gap:4px;padding:6px 8px;border-bottom:1px solid rgba(255,255,255,.07)}
.codebar button{background:transparent;border:0;color:var(--code-dim);font-family:var(--f-code);font-size:.75rem;padding:3px 10px;border-radius:6px}
.codebar button.on{background:rgba(255,255,255,.1);color:var(--code-fg)}
.codebar .cp{margin-left:auto}
.code pre{margin:0;padding:14px 16px;overflow-x:auto;font-family:var(--f-code);font-size:.84rem;line-height:1.55;tab-size:4}
.code pre code{background:none;padding:0;font-size:inherit;color:inherit}
.hljs-keyword,.hljs-built_in,.hljs-meta{color:var(--hl-kw)}
.hljs-string{color:var(--hl-str)} .hljs-number,.hljs-literal{color:var(--hl-num)}
.hljs-comment{color:var(--hl-com);font-style:italic} .hljs-title,.hljs-function{color:var(--hl-fn)} .hljs-type,.hljs-class{color:var(--hl-type)}
.drill{border:2px dashed color-mix(in srgb,var(--pc) 55%,transparent);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.drill p{margin:0}
.exlist{display:flex;flex-direction:column;gap:16px}
.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-width:0}
.ex.done{border-color:color-mix(in srgb,var(--ok) 55%,transparent)}
.exhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.exnum{font-family:var(--f-code);font-weight:600;color:var(--pc);font-size:.85rem}
.exhead h3{font-size:1.18rem;flex:1;min-width:12ch}
.diff{font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border-radius:99px;padding:2px 9px}
.d1{background:color-mix(in srgb,var(--p7) 16%,transparent);color:var(--p7)}
.d2{background:color-mix(in srgb,var(--p3) 18%,transparent);color:var(--p3)}
.d3{background:color-mix(in srgb,var(--p6) 16%,transparent);color:var(--p6)}
.exbody p{margin:0 0 8px} .exbody p:last-child{margin:0}
.exbody ul,.exbody ol{margin:4px 0 8px;padding-left:1.3em}
.extools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:5px 12px;font-size:.84rem}
.btn:hover{border-color:var(--pc)}
.hint{background:color-mix(in srgb,var(--pc) 8%,var(--surface));border-radius:10px;padding:10px 14px;font-size:.93rem}
.checks{display:flex;flex-wrap:wrap;gap:14px;padding-top:10px;border-top:1px solid var(--line);font-size:.85rem;color:var(--muted)}
.checks label{display:flex;gap:6px;align-items:center;cursor:pointer}
.checks input{accent-color:var(--ok);width:16px;height:16px}
.pager{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pager a{text-decoration:none;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);max-width:48%}
.pager a b{color:var(--ink);font-family:var(--f-display);font-size:1rem}
.pager a.next{margin-left:auto;text-align:right}

@media (max-width:860px){
  .shell{grid-template-columns:1fr}
  .rail{position:fixed;inset:0 auto 0 0;width:min(320px,86vw);z-index:20;transform:translateX(-105%);transition:transform .25s;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-left:max(16px,env(safe-area-inset-left,0px))}
  .rail.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.35)}
  .topbar{display:flex;position:sticky;top:env(safe-area-inset-top,0px);z-index:10;align-items:center;gap:10px;background:var(--surface);border-bottom:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px))}
  body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
  .topbar b{font-family:var(--f-display)}
  .main{padding-top:20px}
  .ex{padding:16px}
  .pager a{max-width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

function ghCommitLinks(repo,path,code){

}

function codeBlock(src){

  const langs=['py','cpp','sh','cmake','txt'].filter(l=>src[l]);if(!langs.length)return null;
  let cur=langs.includes(lang)?lang:langs[0];
  const pre=el('pre'),bar=el('div',{class:'codebar'});
  const show=()=>{const c=el('code',{class:LN[cur][1]});c.textContent=src[cur].replace(/^\n/,'').replace(/\s+$/,'');pre.replaceChildren(c);if(window.hljs)try{hljs.highlightElement(c)}catch(e){}bar.querySelectorAll('[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===cur))};
  langs.forEach(l=>bar.append(el('button',{'data-l':l,onclick:()=>{cur=l;show()}},LN[l][0])));
  const cp=el('button',{class:'cp',onclick:()=>{const t=src[cur];const done=()=>{cp.textContent='Copied';setTimeout(()=>cp.textContent='Copy',1200)};try{navigator.clipboard.writeText(t).then(done,()=>sel())}catch(e){sel()}}},'Copy');

}

    if(x.py||x.cpp){let open=false,cb=null;const sb=el('button',{class:'btn'},'Show skeleton');sb.onclick=()=>{open=!open;if(open){cb=codeBlock(x);extra.append(cb);sb.textContent='Hide skeleton'}else{cb&&cb.remove();sb.textContent='Show skeleton'}};tools.append(sb)}
    card.append(tools,hintBox,extra);
    const sb=el('div',{class:'sub','data-sub':id});sb._meta={c,x,label};card.append(sb);renderSub(sb);
    const ch=el('div',{class:'checks'});
    [['s','Solved'],['r','Rewrote from blank'],['p','Ported to other language']].forEach(([k,n])=>{const inp=el('input',{type:'checkbox',id:`ck-${id}-${k}`});inp.checked=!!st[k];inp.onchange=()=>{prog[id]=Object.assign({},prog[id],{[k]:inp.checked});saveProg();card.classList.toggle('done',!!prog[id].s);renderNav(c.id)};ch.append(el('label',{for:`ck-${id}-${k}`},inp,n))});
    card.append(ch);return card;
  };
  c.ex.forEach((x,i)=>list.append(makeCard(x,exId(c,i),`${c.n}.${i+1}`)));
  v.append(list);
  if(c.arena){const ar=el('section',{class:'exlist arena'},el('span',{class:'label',style:'color:var(--pa)'},'Competition arena'),el('div',{class:'arenaintro',html:c.arena.intro}));c.arena.ex.forEach((x,i)=>ar.append(makeCard(x,arId(c,i),`${c.n}.A${i+1}`)));v.append(ar)}
  if(c.drill)v.append(el('div',{class:'drill'},el('span',{class:'label'},'Fluency check'),el('p',{html:c.drill})));
  const i=CH.indexOf(c),pv=CH[i-1],nx=CH[i+1];const pg=el('nav',{class:'pager'});
  if(pv)pg.append(el('a',{href:'#'+pv.id},'← Previous',el('b',{},`${pv.n}. ${pv.title}`)));
  if(nx)pg.append(el('a',{class:'next',href:'#'+nx.id},'Next →',el('b',{},`${nx.n}. ${nx.title}`)));
  v.append(pg);
  typeset(v);
}

function route(){
  const h=location.hash.slice(1);const c=CH.find(x=>x.id===h);
  if(c){renderChapter(c);renderNav(c.id)}else{renderHome();renderNav('home')}
  document.getElementById('rail').classList.remove('open');window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
document.getElementById('menuBtn').onclick=e=>{e.stopPropagation();document.getElementById('rail').classList.toggle('open')};
document.addEventListener('click',e=>{const r=document.getElementById('rail');if(r.classList.contains('open')&&!r.contains(e.target))r.classList.remove('open')});
route();
initCloud();
})();
</script>
